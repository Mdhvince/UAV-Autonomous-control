[DEFAULT]
g = 9.81
frequency = 10
dt = 0.01

# All coordinates are expressed in the NED world frame (x forward, y right, z DOWN):
# an altitude of h meters above ground is z = -h.

[RRT]
# lower and upper space limits for path finding algorithm
space_limits = [[0., 0., -20.],
                [80., 60., -1.0]]
# max distance between two nodes in path finding algorithm
max_distance = 6.0
# max number of iterations in path finding algorithm
max_iterations = 3500
# reproducible planning for this large scenario
random_seed = 0


[SIM_FLIGHT]
velocity = 3.0
start_loc = [2., 2., -2.]
goal_loc = [78., 58., -4.]
# minimum distance to consider a waypoint as reached
min_dist_target = .5
# Buildings at the start of the list are rendered by the dashboard. The floor,
# perimeter walls and ceiling remain collision geometry only.
visible_obstacle_count = 20

# xmin, xmax, ymin, ymax, zmin, zmax
coord_obstacles = [
            # Manhattan-style city blocks. They reach the top of the flight volume,
            # forcing the route through streets instead of above the skyline.
            [7, 17, 6, 16, -20, 0],
            [22, 32, 6, 16, -20, 0],
            [37, 47, 6, 16, -20, 0],
            [52, 62, 6, 16, -20, 0],
            [67, 77, 6, 16, -20, 0],

            [7, 17, 21, 31, -20, 0],
            [22, 32, 21, 31, -20, 0],
            [37, 47, 21, 31, -20, 0],
