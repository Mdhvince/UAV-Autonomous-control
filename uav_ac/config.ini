[DEFAULT]
g = 9.81
frequency = 10
dt = 0.01

# All coordinates are expressed in the NED world frame (x forward, y right, z DOWN):
# an altitude of h meters above ground is z = -h.

[RRT]
# lower and upper space limits for path finding algorithm
space_limits = [[0., 0., -10.],
                [10, 10, -1.0]]
# max distance between two nodes in path finding algorithm
max_distance = 2.5
# max number of iterations in path finding algorithm
max_iterations = 2000


[SIM_FLIGHT]
velocity = 2.0
goal_loc = [9, 9, -2]
# minimum distance to consider a waypoint as reached
min_dist_target = .5

# xmin, xmax, ymin, ymax, zmin, zmax
coord_obstacles = [
            [-2, 11, -2, 11, -0.5, 0],  # floor
            [4, 6, 3, 5, -5, 0],
            [4, 8, 7, 9, -5, 0],
            [1, 3, 3, 5, -5, 0],
            [5, 8, 2, 5, -5, 0],

            # add walls perimeter
            [-2, -1, -1, 6, -5, 0],
            [-2, 11, 11, 12, -5, 0],
            [11, 12, -1, 6, -5, 0],
            [-2, 11, -2, -1, -5, 0],

            # ceiling
            [0, 10, 0, 10, -4, -3],
        ]
